[package]
name = "sealantern-desktop"
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-only"


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 允许 Cargo 自动拉取匹配该 Minor 版本的最新兼容 Patch 版本
tauri = { version = "2.9", features = ["macos-private-api", "protocol-asset"] }

tauri-plugin-dialog = "2.6"
tauri-plugin-fs = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-http = "2.5"
tauri-plugin-process = "2.3"
tauri-plugin-updater = "=2.9.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "sync"] }
num_cpus = "1"

# 内部 crates
sealantern-extra = { path = "../crates/extra" }
sealantern-core = { path = "../crates/core" }
sealantern-infra = { path = "../crates/infra" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "sealantern-desktop"
path = "src/main.rs"
