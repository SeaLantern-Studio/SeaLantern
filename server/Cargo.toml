[package]
name = "sealantern-server"
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "sealantern-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
axum = "0.8"
sealantern-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
