[package]
name = "sealantern-server"
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "sealantern-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
axum = "0.8"
sealantern-application = { path = "../application" }
sealantern-core = { path = "../crates/core" }
sealantern-interface = { path = "../crates/interface" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "net", "signal"] }
axum-vite = "0.3.4"
include_dir = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
