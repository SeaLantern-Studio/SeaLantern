[workspace]
members = [
    "application",
    "crates/core",
    "crates/infra",
    "crates/extra",
    "crates/interface",
    "server",
    "src-tauri",
    "crates/vendor/java-manager",
    "crates/vendor/sysproxy",
]
resolver = "2"

[workspace.package]
version = "1.3.1"

[workspace.package]
edition = "2024"

# 优化配置（从 src-tauri/Cargo.toml 移到这里统一管理）
[profile.release]
opt-level = "z" # 优化二进制大小
lto = true # 启用链接时优化
codegen-units = 1 # 更好的优化，但编译较慢
strip = true # 移除调试符号
