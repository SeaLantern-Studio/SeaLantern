name: 新功能请求
description: 请求添加新功能
title: "[Feature] "
labels: ["enhancement", "pending"]
body:
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 请说明你希望添加的功能
      placeholder: 在这里描述功能
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 理由
      description: 可选，请说明需要这个功能的原因
      placeholder: 在这里填写理由
    validations:
      required: false

  - type: textarea
    id: implementation
    attributes:
      label: 实现细节
      description: 可选，请说明期望的实现方式
      placeholder: 在这里填写实现建议
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 可选，请说明是否存在其他方案
      placeholder: 在这里填写替代方案
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 影响
      description: 可选，请说明对现有功能的影响
      placeholder: 在这里填写可能的影响
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 可选，请说明怎样才算完成该功能
      placeholder: 在这里填写验收标准
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 可选，例如界面草图等补充材料
      placeholder: 在这里填写其他信息
    validations:
      required: false
