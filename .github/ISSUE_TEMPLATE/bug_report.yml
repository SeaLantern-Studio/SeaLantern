name: 错误报告
description: 报告软件中存在的问题
title: "[错误] "
labels: ["bug", "pending"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请详细描述遇到的问题
      placeholder: 在这里描述你的问题
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 可选，请说明如何复现这个问题
      placeholder: 在这里填写复现步骤
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 可选，请说明你预期发生的行为
      placeholder: 在这里填写预期行为
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 可选，请说明实际发生的行为
      placeholder: 在这里填写实际行为
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 环境

  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 例如 Windows 11、macOS 14、Ubuntu 22.04
      placeholder: 例如 Windows 11
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 例如 1.2.0 或 main 分支最新版本
      placeholder: 例如 1.2.0
    validations:
      required: true

  - type: textarea
    id: other-env
    attributes:
      label: 其他环境信息
      description: 可选，例如 Java 版本、Minecraft 版本等
      placeholder: 在这里填写其他环境信息
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可选，请粘贴日志文件上传地址或上传图片
      placeholder: 在这里粘贴日志文件上传地址
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 其他信息
      description: 可选，如无其他信息可忽略
      placeholder: 在这里填写其他信息
    validations:
      required: false
