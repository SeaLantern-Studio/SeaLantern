name: "Docker 构建检查"

on:
  pull_request:
    branches: [main]
    paths:
      - "docker/Dockerfile"
      - "docker/docker-compose.yml"
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker-check.yml"
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile"
      - "docker/docker-compose.yml"
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker-check.yml"

concurrency:
  group: docker-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stand-by:
    runs-on: ubuntu-latest
    steps:
      - name: "等待重构"
        run: echo "等待docker重构完成"

