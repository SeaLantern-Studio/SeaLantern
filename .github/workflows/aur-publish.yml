name: "推送 AUR"

on:
  release:
    types: [published]

concurrency:
  group: aur-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aur-publish:
    name: 发布到 AUR
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: archlinux:latest
      options: --user root
    env:
      AUR_PKGBASE: sealantern
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

    steps:
      - name: 安装依赖
        run: |
          set -euo pipefail
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm base-devel git sudo openssh

          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - name: 检出发布版本
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: 提取发布信息
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          VERSION="$(printf '%s' "$RELEASE_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "无法从 Release tag 提取版本号: $RELEASE_TAG" >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 生成 AUR 包信息（不接触密钥）
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          # 先用 Release tag 检出的配方渲染 PKGBUILD 并生成 .SRCINFO，再去配置 AUR 密钥：
          # 这样即使 tag 指向的代码不可信，也无法在持有私钥的环境里被执行。
          bash scripts/ci/arch-package.sh render "${VERSION}" "${TAG}" aur-staging
          chown -R builder:builder aur-staging
          sudo -u builder bash -c 'cd aur-staging && makepkg --printsrcinfo > .SRCINFO'
          ls -l aur-staging

      - name: 配置 AUR SSH
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 /root/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> /root/.ssh/known_hosts

      - name: 推送到 AUR
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND='ssh -i /root/.ssh/aur -o IdentitiesOnly=yes'

          # 该步骤只做 git 与文件复制，不执行仓库内脚本，私钥只在这一步可用。
          git clone "ssh://aur@aur.archlinux.org/${AUR_PKGBASE}.git" aur
          cp aur-staging/PKGBUILD aur-staging/.SRCINFO \
             aur-staging/sealantern.desktop aur-staging/sealantern.install aur/

          git -C aur add PKGBUILD .SRCINFO sealantern.desktop sealantern.install
          if git -C aur diff --cached --quiet; then
            echo "AUR 包信息没有变化"
            exit 0
          fi

          git -C aur config user.name "$BOT_NAME"
          git -C aur config user.email "$BOT_EMAIL"
          git -C aur commit -m "chore(release): 发布 sealantern v${VERSION}"
          git -C aur push
