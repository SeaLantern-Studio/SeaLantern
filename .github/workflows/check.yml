name: "代码质量检查"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend-application: ${{ steps.filter.outputs['backend-application'] }}
      backend-core: ${{ steps.filter.outputs['backend-core'] }}
      backend-infra: ${{ steps.filter.outputs['backend-infra'] }}
      backend-extra: ${{ steps.filter.outputs['backend-extra'] }}
      backend-interface: ${{ steps.filter.outputs['backend-interface'] }}
      backend-server: ${{ steps.filter.outputs['backend-server'] }}
      backend-tauri: ${{ steps.filter.outputs['backend-tauri'] }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'application/**'
              - 'crates/**'
              - 'server/**'
              - 'src-tauri/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - '.github/actions/**'
              - '.github/workflows/check.yml'
            backend-application:
              - 'application/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - '.github/actions/**'
              - '.github/workflows/check.yml'
            backend-core:
              - 'crates/core/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - '.github/actions/**'
              - '.github/workflows/check.yml'
            backend-infra:
              - 'crates/infra/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - '.github/actions/**'
              - '.github/workflows/check.yml'
            backend-extra:
              - 'crates/extra/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - '.github/actions/**'
              - '.github/workflows/check.yml'
            backend-interface:
              - 'crates/interface/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - '.github/actions/**'
              - '.github/workflows/check.yml'
            backend-server:
              - 'server/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - '.github/actions/**'
              - '.github/workflows/check.yml'
            backend-tauri:
              - 'src-tauri/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - '.github/actions/**'
              - '.github/workflows/check.yml'
            frontend:
              - 'src/**'
              - 'scripts/**'
              - 'tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'knip.json'
              - 'tsconfig*.json'
              - 'index.html'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - '.github/actions/**'
              - '.github/workflows/check.yml'
            docs:
              - 'docs/**'
              - 'scripts/check-docs-tmp.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/check.yml'

  backend-lint:
    name: 后端代码规范 (fmt + clippy)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        uses: ./.github/actions/install-tauri-dependencies

      - name: 设置 Rust 环境
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          cache: "true"
          retry: "true"

      - name: 检查代码格式 (Rust)
        run: cargo fmt --all -- --check

      - name: 运行 Clippy 检查
        run: cargo clippy --workspace --all-targets -- -D warnings

  backend-test-application:
    name: 后端测试 (application)
    needs: [changes, backend-lint]
    if: ${{ needs.changes.outputs['backend-application'] == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Rust 环境
        uses: ./.github/actions/setup-rust

      - name: 运行测试
        run: cargo test -p sealantern-application

  backend-test-core:
    name: 后端测试 (core)
    needs: [changes, backend-lint]
    if: ${{ needs.changes.outputs['backend-core'] == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Rust 环境
        uses: ./.github/actions/setup-rust

      - name: 运行测试
        run: cargo test -p sealantern-core --lib
        env:
          RUSTFLAGS: "--cfg ci_skip_validation"

  backend-test-extra:
    name: 后端测试 (extra)
    needs: [changes, backend-lint]
    if: ${{ needs.changes.outputs['backend-extra'] == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Rust 环境
        uses: ./.github/actions/setup-rust

      - name: 运行测试
        run: cargo test -p sealantern-extra

  backend-test-infra:
    name: 后端测试 (infra)
    needs: [changes, backend-lint]
    if: ${{ needs.changes.outputs['backend-infra'] == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Rust 环境
        uses: ./.github/actions/setup-rust

      - name: 运行测试
        run: cargo test -p sealantern-infra --all-features

  backend-test-interface:
    name: 后端测试 (interface)
    needs: [changes, backend-lint]
    if: ${{ needs.changes.outputs['backend-interface'] == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Rust 环境
        uses: ./.github/actions/setup-rust

      - name: 运行测试
        run: cargo test -p sealantern-interface

  backend-test-server:
    name: 后端测试 (server)
    needs: [changes, backend-lint]
    if: ${{ needs.changes.outputs['backend-server'] == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Rust 环境
        uses: ./.github/actions/setup-rust

      - name: 运行测试
        run: cargo test -p sealantern-server

  backend-test-tauri:
    name: 后端测试 (tauri)
    needs: [changes, backend-lint]
    if: ${{ needs.changes.outputs['backend-tauri'] == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        uses: ./.github/actions/install-tauri-dependencies

      - name: 设置 Rust 环境（缓存只恢复）
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"
          cache-save: "false"

      - name: 运行测试
        run: cargo test --bin sealantern -p sealantern

  backend:
    name: 后端检查 (Rust)
    needs:
      [
        backend-lint,
        backend-test-application,
        backend-test-core,
        backend-test-infra,
        backend-test-interface,
        backend-test-server,
        backend-test-extra,
        backend-test-tauri,
      ]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: 汇总后端检查状态
        run: |
          failed=$(echo '${{ toJSON(needs) }}' | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          if [[ -n "$failed" ]]; then
            echo "::error ::后端检查失败，以下模块未通过：$failed"
            exit 1
          else
            echo "所有后端模块检查通过！"
          fi

  frontend:
    name: 前端检查 (Node)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 pnpm 环境
        uses: ./.github/actions/setup-pnpm

      - name: 安装前端依赖
        run: |
          pnpm install --frozen-lockfile

      - name: 运行前端全量检查
        run: pnpm run fmt:check && pnpm run lint && pnpm run build:check

      - name: Knip 死代码 dry-run（非阻塞，仅报告）
        # TODO(#1016): 冗余项清理完毕后移除 continue-on-error，改为强制检查
        continue-on-error: true
        run: pnpm knip

      - name: 运行前端测试
        run: pnpm test

  docs-check:
    name: 文档临时文件检查
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 pnpm 环境
        uses: ./.github/actions/setup-pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 校验临时文档
        run: pnpm docs:check
