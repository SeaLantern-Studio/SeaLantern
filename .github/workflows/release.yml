name: "发布"

on:
  push:
    tags:
      - "v*"
      - "sea-lantern-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  validate-tag:
    name: 校验 Tag 来源并提取版本
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_body: ${{ steps.meta.outputs.release_body }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成共享平台矩阵
        id: matrix
        run: |
          set -euo pipefail
          jq -e '
            .include as $rows |
            ($rows | type == "array" and length > 0) and
            ([$rows[].asset_key] | length == (unique | length)) and
            (all($rows[];
              (.platform | type == "string" and length > 0) and
              (.name | type == "string" and length > 0) and
              (.args | type == "string") and
              (.rust_target | type == "string") and
              (.asset_os == "linux" or .asset_os == "macos" or .asset_os == "windows") and
              (.asset_arch == "x64" or .asset_arch == "arm64") and
              (.asset_key | test("^[a-z0-9-]+$"))
            ))
          ' .github/release-matrix.json >/dev/null
          MATRIX="$(jq -c . .github/release-matrix.json)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: 校验 Tag 指向 main 分支提交
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "❌ 当前 tag (${GITHUB_REF_NAME}) 对应提交不在 main 分支上"
            exit 1
          fi
          echo "✅ Tag 来源校验通过"

      - name: 校验主检查已通过
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = process.env.GITHUB_SHA;
            const requiredWorkflowName = '代码质量检查';

            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              head_sha: headSha,
              per_page: 20,
            });

            const passed = response.data.workflow_runs.some((run) =>
              run.name === requiredWorkflowName &&
              run.head_sha === headSha &&
              run.event === 'push' &&
              run.head_branch === 'main' &&
              run.status === 'completed' &&
              run.conclusion === 'success'
            );

            if (!passed) {
              core.setFailed(`❌ 提交 ${headSha} 尚未通过 main 分支上的 ${requiredWorkflowName}`);
              return;
            }

            core.info(`✅ 提交 ${headSha} 已通过 main 分支上的 ${requiredWorkflowName}`);

      - name: 提取版本信息
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! echo "$TAG" | grep -Eq '^(v|sea-lantern-v)[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "❌ 当前 tag 不符合支持的版本格式: $TAG"
            exit 1
          fi
          VERSION="$(echo "$TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "❌ 无法从 tag 提取版本号: $TAG"
            exit 1
          fi

          PRERELEASE=false
          if echo "$TAG" | grep -Eq '^(v|sea-lantern-v)[0-9]+\.[0-9]+\.[0-9]+-'; then
            PRERELEASE=true
          fi

          RELEASE_NAME="Sea Lantern v${VERSION}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_body<<EOF" >> "$GITHUB_OUTPUT"
          echo "## 下载说明" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "如果你只想下载后直接运行：Windows 选 portable.zip，Mac 选 portable.tar.gz，Linux 选 AppImage。" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "- \`x64-setup.exe\`：Windows 64 位安装包，双击后按提示安装即可。" >> "$GITHUB_OUTPUT"
          echo "- \`x64_en-US.msi\`：Windows 64 位安装包，适合手动部署或需要 MSI 的场景。" >> "$GITHUB_OUTPUT"
          echo "- \`Sea.Lantern_${VERSION}_windows_x64_portable.zip\` / \`Sea.Lantern_${VERSION}_windows_arm64_portable.zip\`：Windows 免安装版，解压后直接运行。" >> "$GITHUB_OUTPUT"
          echo "- \`x64.dmg\`：适用于 Intel Mac。" >> "$GITHUB_OUTPUT"
          echo "- \`aarch64.dmg\`：适用于 Apple 芯片 Mac。" >> "$GITHUB_OUTPUT"
          echo "- \`Sea.Lantern_${VERSION}_macos_x64_portable.tar.gz\` / \`Sea.Lantern_${VERSION}_macos_arm64_portable.tar.gz\`：Mac 免安装版，解压后把 \`.app\` 放到任意位置即可打开。" >> "$GITHUB_OUTPUT"
          echo "- \`*.AppImage\`：Linux 免安装版，给文件执行权限后即可直接运行。" >> "$GITHUB_OUTPUT"
          echo "- \`*.deb\` / \`*.rpm\`：Linux 安装包。" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "✅ 发布版本: $VERSION"

  build-tauri:
    name: 构建 ${{ matrix.name }}
    needs: validate-tag
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-tag.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖 (Ubuntu 专用)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-tauri-dependencies
        with:
          install-xdg-utils: "true"

      - name: 设置 pnpm 环境
        uses: ./.github/actions/setup-pnpm

      - name: 设置 Rust 环境
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust_target }}
          cache: "true"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Tauri 产物
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }} -c src-tauri/tauri.conf.json

      - name: 收集 Unix 发布产物
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET_OS: ${{ matrix.asset_os }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ASSET_KEY: ${{ matrix.asset_key }}
        run: |
          bash scripts/ci/collect-assets.sh \
            "$ASSET_OS" "$VERSION" "$ASSET_ARCH" "$ASSET_KEY"

      - name: 收集 Windows 发布产物
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ASSET_KEY: ${{ matrix.asset_key }}
        run: |
          $params = @{
            Version = $env:VERSION
            AssetArch = $env:ASSET_ARCH
            AssetKey = $env:ASSET_KEY
          }
          & ./scripts/ci/collect-assets.ps1 @params

      - name: 上传本平台构建产物到工作流
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.asset_key }}
          path: ${{ runner.temp }}/release-assets-${{ matrix.asset_key }}/*
          if-no-files-found: error
          retention-days: 3

  publish-release:
    name: 汇总正式发布草稿
    needs:
      - validate-tag
      - build-tauri
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: 检出发布脚本
        uses: actions/checkout@v4

      - name: 下载全部平台构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets

      - name: 校验并创建正式发布草稿
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_JSON: ${{ needs.validate-tag.outputs.matrix }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
          RELEASE_NAME: ${{ needs.validate-tag.outputs.release_name }}
          RELEASE_BODY: ${{ needs.validate-tag.outputs.release_body }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        run: |
          bash scripts/ci/publish-assets.sh \
            release-assets "$TAG" "$RELEASE_NAME" "$GITHUB_SHA" true "$PRERELEASE" false
