[package]
name = "sealantern-application"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.91"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "sync", "fs", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sealantern-core = { path = "../crates/core" }
sealantern-interface = { path = "../crates/interface" }
sealantern-extra = { path = "../crates/extra", features = ["online-tunnel"] }
sealantern-infra = { path = "../crates/infra" }

[dev-dependencies]
tempfile = "3"
zip = { version = "2.0", default-features = false, features = ["deflate"] }
