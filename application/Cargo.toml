[package]
name = "sealantern-application"
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.91"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "sync", "fs", "time"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sealantern-core = { path = "../crates/core" }
sealantern-interface = { path = "../crates/interface" }
sealantern-extra = { path = "../crates/extra", features = ["online-tunnel"] }
sealantern-infra = { path = "../crates/infra" }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
