<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si si-book" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>    /* 书本：悬停时绕书脊轻摆，像被风翻动 */
    .si-book .book-body { transform-box: fill-box; transform-origin: 0% 50%; }
    .si-book .book-body { animation: sl-book-sway 1s ease-in-out infinite; animation-play-state: var(--sl-anim-play, paused); }
    @keyframes sl-book-sway { 0%,100% { transform: rotate(0deg); } 30% { transform: rotate(-6deg); } 70% { transform: rotate(4deg); } }
    .si-book:hover { --sl-anim-play: running; }
  </style>
  <g class="book-body">
    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
  </g>
</svg>
