<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si si-link2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>    /* 链接：悬停时两端环拉开再合上 */
    .si-link2 .ring-l, .si-link2 .ring-r { transform-box: fill-box; }
    .si-link2 .ring-l { animation: sl-link-pull .75s ease-in-out infinite; animation-play-state: var(--sl-anim-play, paused); }
    .si-link2 .ring-r { animation: sl-link-pull-r .75s ease-in-out infinite; animation-play-state: var(--sl-anim-play, paused); }
    @keyframes sl-link-pull   { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-1.2px); } }
    @keyframes sl-link-pull-r { 0%,100% { transform: translateX(0); } 50% { transform: translateX(1.2px); } }
    .si-link2:hover { --sl-anim-play: running; }
  </style>
  <path class="ring-l" d="M9 17H7A5 5 0 0 1 7 7h2"/>
  <path class="ring-r" d="M15 7h2a5 5 0 1 1 0 10h-2"/>
  <line x1="8" y1="12" x2="16" y2="12"/>
</svg>
