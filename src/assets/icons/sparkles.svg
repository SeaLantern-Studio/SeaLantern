<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si si-sparkles" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>    /* 星光：悬停时主星轻摆闪耀，小星点闪烁 */
    .si-sparkles .star-main { transform-box: fill-box; transform-origin: 50% 50%; }
    .si-sparkles .star-dot { transform-box: fill-box; transform-origin: 50% 50%; }
    .si-sparkles .star-main { animation: sl-spark-sway 1s ease-in-out infinite; animation-play-state: var(--sl-anim-play, paused); }
    .si-sparkles .star-dot { animation: sl-spark-twinkle .8s ease-in-out infinite; animation-play-state: var(--sl-anim-play, paused); }
    .si-sparkles .star-dot-2 { animation-delay: .25s; }
    @keyframes sl-spark-sway    { 0%,100% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(-9deg) scale(1); } 75% { transform: rotate(9deg) scale(1.06); } }
    @keyframes sl-spark-twinkle { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .25; transform: scale(.8); } }
    .si-sparkles:hover { --sl-anim-play: running; }
  </style>
  <path class="star-main" d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
  <g class="star-dot star-dot-1"><path d="M20 3v4"/><path d="M22 5h-4"/></g>
  <g class="star-dot star-dot-2"><path d="M4 17v2"/><path d="M5 18H3"/></g>
</svg>
