<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si si-archive" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>    /* 归档箱：悬停时盖子掀起一条缝 */
    .si-archive .lid { transform-box: fill-box; }
    .si-archive .lid { animation: sl-arch-lid .8s ease-in-out infinite; animation-play-state: var(--sl-anim-play, paused); }
    @keyframes sl-arch-lid { 0%,100% { transform: translateY(0); } 45% { transform: translateY(-1.1px); } }
    .si-archive:hover { --sl-anim-play: running; }
  </style>
  <rect class="lid" x="2" y="3" width="20" height="5" rx="1"/>
  <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/>
  <path d="M10 12h4"/>
</svg>
