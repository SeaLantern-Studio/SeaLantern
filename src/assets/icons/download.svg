<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si si-download" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>    /* 下载：悬停时箭头向下溜一截再回位 */
    .si-download .dl-arrow { transform-box: fill-box; }
    .si-download .dl-arrow { animation: sl-dl-drop .75s ease-in-out infinite; animation-play-state: var(--sl-anim-play, paused); }
    @keyframes sl-dl-drop { 0%,100% { transform: translateY(0); } 55% { transform: translateY(1.6px); } }
    .si-download:hover { --sl-anim-play: running; }
  </style>
  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
  <g class="dl-arrow">
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </g>
</svg>
