<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si si-store" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>    /* 商店：悬停时遮棚下压弹回，像风掀雨棚 */
