    .si-store .awning { animation: sl-store-flap .8s ease-in-out infinite; animation-play-state: var(--sl-anim-play, paused); }
    @keyframes sl-store-flap { 0%,100% { transform: translateY(0); } 50% { transform: translateY(.9px); } }
    .si-store:hover { --sl-anim-play: running; }
  </style>
