<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si si-sliders" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>    /* 滑杆：悬停时三个滑块依次滑动调节 */
    .si-sliders .knob { transform-box: fill-box; }
    .si-sliders .knob-1 { animation: sl-slide-move .8s ease-in-out infinite; animation-play-state: var(--sl-anim-play, paused); }
    .si-sliders .knob-2 { animation: sl-slide-move .8s ease-in-out .15s infinite; animation-play-state: var(--sl-anim-play, paused); }
    .si-sliders .knob-3 { animation: sl-slide-move .8s ease-in-out .3s infinite; animation-play-state: var(--sl-anim-play, paused); }
    @keyframes sl-slide-move { 0%,100% { transform: translateX(0); } 50% { transform: translateX(1.6px); } }
    .si-sliders:hover { --sl-anim-play: running; }
  </style>
  <line x1="21" y1="4" x2="14" y2="4"/>
  <line x1="10" y1="4" x2="3" y2="4"/>
  <line class="knob knob-1" x1="14" y1="2" x2="14" y2="6"/>
  <line x1="21" y1="12" x2="12" y2="12"/>
  <line x1="8" y1="12" x2="3" y2="12"/>
  <line class="knob knob-2" x1="8" y1="10" x2="8" y2="14"/>
  <line x1="21" y1="20" x2="16" y2="20"/>
  <line x1="12" y1="20" x2="3" y2="20"/>
  <line class="knob knob-3" x1="16" y1="18" x2="16" y2="22"/>
</svg>
