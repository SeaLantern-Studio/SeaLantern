<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="si si-info" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <style>    /* 信息：悬停时 i 轻跳提醒，圆环微呼吸 */
    .si-info .i-ring { transform-box: fill-box; transform-origin: 50% 50%; }
    .si-info .i-mark { transform-box: fill-box; }
    .si-info .i-ring { animation: sl-info-ring 1s ease-in-out infinite; animation-play-state: var(--sl-anim-play, paused); }
    .si-info .i-mark { animation: sl-info-hop .5s ease-in-out infinite; animation-play-state: var(--sl-anim-play, paused); }
    @keyframes sl-info-ring { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes sl-info-hop  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
    .si-info:hover { --sl-anim-play: running; }
  </style>
  <circle class="i-ring" cx="12" cy="12" r="10"/>
  <g class="i-mark">
    <path d="M12 16v-4"/>
    <path d="M12 8h.01"/>
  </g>
</svg>
