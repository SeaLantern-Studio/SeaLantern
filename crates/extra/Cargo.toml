[package]
name = "sealantern-extra"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
path = "src/lib.rs"

[features]
default = []
online-tunnel = ["dep:sculk"]

[dependencies]
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "sync"] }
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
tempfile = "3"
sealantern-infra = { path = "../infra" }

[features]
default = []
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
dirs = "5"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] }
sculk = { version = "=0.3.1", default-features = false, optional = true }
