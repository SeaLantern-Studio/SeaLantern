[package]
name = "sealantern-interface"
version = "1.2.0"
edition.workspace = true
license = "GPL-3.0-only"

[lib]
path = "src/lib.rs"

[features]
default = []

[dependencies]
async-trait = "0.1.91"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sealantern-core = { path = "../core" }
sealantern-extra = { path = "../extra" }

[dev-dependencies]
serde_json = "1"
