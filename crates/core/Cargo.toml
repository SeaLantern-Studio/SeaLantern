[package]
name = "sealantern-core"
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
zip = { version = "2.0", default-features = false, features = ["deflate"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ci_skip_validation)'] }
